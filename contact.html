<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Luma Peptides Co.</title>
<meta name="description" content="Get in touch with the Luma Peptides Co. care team.">
<meta name="theme-color" content="#F7F2EC">
<meta property="og:title" content="Contact — Luma Peptides Co.">
<meta property="og:description" content="Get in touch with the Luma Peptides Co. care team.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20260907c">
<script src="js/products.js?v=20260907c" defer></script>
<script src="js/site.js?v=20260907c" defer></script>

</head>
<body>
<main id="main">

<div class="wrap page-head"><span class="eyebrow">We're here</span><h1>Contact us</h1><p>Questions about a protocol, an order, or a lot result? A real person replies within one business day.</p></div>
<div class="wrap contact-grid">
 <div class="contact-info">
  <div><b>Email</b><span><a href="mailto:hello@lumapeptides.co" style="color:var(--terra)">hello@lumapeptides.co</a></span></div>
  <div><b>Care team hours</b><span>Monday–Friday, 8am–6pm CT</span></div>
  <div><b>Text us</b><span>(555) 010-LUMA</span></div>
  <div><b>Mailing address</b><span>Luma Peptides Co.<br>PO Box 1120<br>Austin, TX 78701</span></div>
 </div>
 <form class="panel" id="contactForm">
  <div class="form-grid">
   <div class="field"><label for="cname">Name</label><input id="cname" required></div>
   <div class="field"><label for="cemail">Email</label><input id="cemail" type="email" required></div>
   <div class="field full"><label for="ctopic">Topic</label><select id="ctopic"><option>Question about a protocol</option><option>My order</option><option>Lot / certificate question</option><option>Subscription change</option><option>Something else</option></select></div>
   <div class="field full"><label for="cmsg">Message</label><textarea id="cmsg" rows="5" required></textarea></div>
  </div>
  <button class="btn btn-primary" style="margin-top:1rem">Send message</button>
 </form>
</div>
<script>document.addEventListener("DOMContentLoaded",()=>{document.getElementById("contactForm").addEventListener("submit",e=>{e.preventDefault();toast("Thanks — we'll reply within one business day.");e.target.reset();});});</script>

</main>
</body>
</html>
